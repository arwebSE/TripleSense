[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "TripleSense"
version = "0.5.1"
description = "Share a DualSense controller between computers, including audio and microphone"
requires-python = ">=3.11"
license = "MIT"
license-files = [
    "LICENSE", "THIRD_PARTY_NOTICES.md",
    "vendor/ds5-virtual-cable/LICENSE", "vendor/ds5-virtual-cable/NOTICE",
    "vendor/ds5-virtual-cable/ATTRIBUTIONS.md",
]
dependencies = ["cryptography>=45,<48"]

[project.optional-dependencies]
controller = ["hidapi>=0.15,<0.16", "numpy>=2.2,<3", "av>=16,<19"]
dev = ["ruff>=0.14,<0.15"]
hardware-test = ["sounddevice>=0.5.3,<0.6"]
app = ["PySide6-Essentials>=6.8,<7", "spake2>=0.9,<1", "zeroconf>=0.148,<1",
       "keyring>=25.6,<26",
       "evdev>=1.9,<2; sys_platform == 'linux'"]
build = ["pyinstaller>=6.16,<7"]

[project.scripts]
triplesense = "dualsensedriver.cli:main"
dsshine = "dualsensedriver.cli:main"
ds5driver = "dualsensedriver.cli:main"

[project.gui-scripts]
triplesense-app = "dualsensedriver.app:main"
dsshine-app = "dualsensedriver.app:main"

[tool.setuptools]
packages = ["dualsensedriver", "ds5emu", "ds5bridge"]

[tool.setuptools.package-data]
dualsensedriver = ["assets/*"]

[tool.setuptools.package-dir]
dualsensedriver = "src/dualsensedriver"
ds5emu = "vendor/ds5-virtual-cable/emulator/ds5emu"
ds5bridge = "vendor/ds5-virtual-cable/prototype/ds5bridge"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["vendor", ".research"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
