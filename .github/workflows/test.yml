name: Verify bridge
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[controller,dev]"
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m unittest discover -s vendor/ds5-virtual-cable/emulator/tests -t vendor/ds5-virtual-cable/emulator
